# Etape 12/20 : gateway (Ingress NGINX). Activer avant : minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rental-gateway
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /cars
            pathType: Prefix
            backend:
              service: { name: car-rental, port: { number: 8080 } }
          - path: /rentals
            pathType: Prefix
            backend:
              service: { name: car-rental, port: { number: 8080 } }
          - path: /customers
            pathType: Prefix
            backend:
              service: { name: customer-service, port: { number: 8080 } }
