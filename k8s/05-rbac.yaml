# Etape 18/20 (securite) : RBAC
# - les pods n'ont pas acces a l'API Kubernetes (automountServiceAccountToken: false)
# - un compte "observateur" ne peut que lire les ressources du namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observateur
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lecture-seule
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observateur-lecture-seule
subjects:
  - kind: ServiceAccount
    name: observateur
    namespace: default
roleRef:
  kind: Role
  name: lecture-seule
  apiGroup: rbac.authorization.k8s.io
