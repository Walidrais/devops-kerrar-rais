# Deploiement complet : kubectl apply -k k8s/
# Images publiees sur Docker Hub par le workflow GitHub Actions
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 01-mysql.yaml
  - 02-customer-service.yaml
  - 03-car-rental.yaml
  - 04-ingress.yaml
  - 05-rbac.yaml
images:
  - name: car-rental
    newName: walidraiis/car-rental
    newTag: latest
  - name: customer-service
    newName: walidraiis/customer-service
    newTag: latest
