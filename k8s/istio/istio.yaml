# Etape 18/20 (securite avancee) : Istio = gateway + mTLS + autorisations
# Prerequis :
#   istioctl install --set profile=demo -y
#   kubectl label namespace default istio-injection=enabled
#   kubectl rollout restart deployment      (pour injecter les sidecars)
#   kubectl apply -f k8s/istio/istio.yaml
---
# Gateway Istio : remplace l'Ingress NGINX comme point d'entree
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: rental-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port: { number: 80, name: http, protocol: HTTP }
      hosts: ["*"]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: rental
spec:
  hosts: ["*"]
  gateways: [rental-gateway]
  http:
    - match:
        - uri: { prefix: /customers }
      route:
        - destination: { host: customer-service, port: { number: 8080 } }
    - match:
        - uri: { prefix: /cars }
        - uri: { prefix: /rentals }
      route:
        - destination: { host: car-rental, port: { number: 8080 } }
---
# mTLS obligatoire entre tous les pods du namespace
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
spec:
  mtls:
    mode: STRICT
---
# customer-service n'accepte que car-rental et la gateway
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: customer-service-allow
spec:
  selector:
    matchLabels:
      app: customer-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/default/sa/car-rental
              - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
---
# MySQL n'accepte que car-rental
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: mysql-allow
spec:
  selector:
    matchLabels:
      app: mysql
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/default/sa/car-rental
