spring.application.name=car-rental
server.port=8080

# Base de donnees : H2 en memoire par defaut.
# Dans Kubernetes, SPRING_DATASOURCE_URL / USERNAME / PASSWORD pointent vers MySQL.
spring.datasource.url=jdbc:h2:mem:rental
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Adresse du deuxieme service (surchargee par CUSTOMER_SERVICE_URL dans Kubernetes)
customer-service.url=${CUSTOMER_SERVICE_URL:http://localhost:8081}

# Sondes Kubernetes : /actuator/health/liveness et /actuator/health/readiness
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Renvoie le message d erreur (ex. "Client inconnu") dans la reponse JSON
server.error.include-message=always
